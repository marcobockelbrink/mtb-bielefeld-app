# Der vollständige Betriebsaufbau auf dem Entwicklungsrechner.
#
#   docker compose -f betrieb/docker-compose.yml up --build
#
# Danach: API über http://localhost, Postfach über http://localhost:8025
#
# Was auf dem Server anders ist, steht daneben in
# `docker-compose.server.yml` und wird darübergelegt:
#
#     docker compose -f betrieb/docker-compose.yml \
#                    -f betrieb/docker-compose.server.yml up -d --build
#
# Eine Überlagerung und keine zweite Vollfassung: So bleibt der Unterschied
# an einer Stelle und in dreißig Sekunden lesbar, statt beim ersten Ändern
# auseinanderzulaufen. Wer hier etwas ergänzt, das auf dem Server anders sein
# muss, trägt es dort ein — nicht als Kommentar hierher.
#
# Was dort geändert wird: Portbindung und 443, `restart: unless-stopped`, die
# Caddyfile mit dem Domainnamen, SMTP ohne Rückfall auf Mailpit, und Mailpit
# selbst läuft nicht mit.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Bewusst **keine** Portfreigabe: Auf die Datenbank kommt nur, wer im
    # Compose-Netz ist. Der Entwicklungs-Postgres aus api/docker-compose.yml
    # hört weiterhin auf 127.0.0.1:5432 — die beiden stören sich nicht.
    volumes:
      - betrieb-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # Aus dem Wurzelverzeichnis, weil die geteilten Parser-Module unter
      # src/ liegen und nicht unter api/.
      context: ..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Lokal fängt Mailpit alles ab; auf dem Server steht hier der
      # Mailserver des Vereins. Die Vorgaben nach `:-` gelten nur, wenn die
      # `.env` dazu schweigt — so bleibt der lokale Aufbau ohne Zutun
      # lauffähig, und der Server braucht nur vier Zeilen in seiner `.env`.
      #
      # Benutzer und Passwort bewusst mit **leerer** Vorgabe statt weggelassen:
      # `waehleMailer` (`api/src/mailer.ts`) prüft `benutzer && passwort`, und
      # ein leerer String ist falsch — es bleibt also bei Mailpit ohne
      # Anmeldung, genau richtig. Ausgeschrieben ist das lesbar; ganz
      # weggelassen müsste man den Quelltext lesen, um dasselbe zu wissen.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_BENUTZER: ${SMTP_BENUTZER:-}
      SMTP_PASSWORT: ${SMTP_PASSWORT:-}
      MAIL_ABSENDER: ${MAIL_ABSENDER}
      APP_BASIS_URL: ${APP_BASIS_URL}
      API_BASIS_URL: ${API_BASIS_URL}
      # Versionsprüfung (Handoff 16). Alle drei ohne Vorgabe harmlos:
      # `MINDEST_APP_VERSION` fällt in der API auf `0.0.0` zurück, und
      # damit wird **niemand** ausgesperrt. Die Begründung samt Warnung
      # steht in `betrieb/.env.beispiel`.
      MINDEST_APP_VERSION: ${MINDEST_APP_VERSION:-}
      AKTUELLE_APP_VERSION: ${AKTUELLE_APP_VERSION:-}
      APP_UPDATE_HINWEIS: ${APP_UPDATE_HINWEIS:-}
      NODE_ENV: production
      # Die Adresse des Compose-Netzes: Nur Anfragen von dort — also von
      # Caddy — dürfen `X-Forwarded-For` bestimmen, wer die IP-Begrenzung
      # sieht. Siehe `vertrauterProxy` in `api/src/app.ts`.
      VERTRAUTER_PROXY: ${VERTRAUTER_PROXY:-172.16.0.0/12}
      # Wohin die Bilddateien der Fotoalben gehen. Der Wert ist der Pfad
      # **im Container**; welches Volume dahinterliegt, entscheidet
      # `volumes:` unten. Ohne die Angabe fiele die API auf `/fotos`
      # zurück — dasselbe Verzeichnis, nur unausgesprochen.
      FOTO_WURZEL: /fotos
    volumes:
      # Bilder gehören nicht in die Datenbank: Sie würden jede Sicherung und
      # jedes `pg_dump` mitschleppen, und ein Vereinsjahr wäre zweistellig in
      # Gigabyte. Ein eigenes Volume lässt sich außerdem getrennt sichern und
      # getrennt umziehen, wenn der Vereinsserver kommt.
      - betrieb-fotos:/fotos
    depends_on:
      postgres:
        condition: service_healthy
    # Keine Portfreigabe: Erreichbar ist die API ausschließlich über Caddy.
    # Genau so steht sie später auch auf dem Server.
    #
    # `KALENDER_URL` steht hier bewusst **nicht**: `termine.ts` wählt mit
    # `process.env.KALENDER_URL ?? CALENDAR_ICS_URL`, und `??` greift nur bei
    # `undefined` — ein leer durchgereichter Wert wäre eine leere Adresse und
    # der Kalenderabruf scheiterte. Wer einen anderen Kalender will, trägt
    # die Zeile hier ein; sonst gilt der echte Vereinskalender.

  caddy:
    build: ./caddy
    environment:
      # Lokal reicht `:80` — ohne Domainnamen versucht Caddy gar nicht erst,
      # ein Zertifikat zu holen. Auf dem Server steht in der `.env` die
      # Domain, und derselbe Caddyfile holt dann eines. Ein Wert, eine Datei.
      API_DOMAIN: ${API_DOMAIN:-:80}
      # Die App-Kennung für Universal Links. Caddy löst `{$AASA_APP_ID}` aus
      # **seiner eigenen** Umgebung auf, nicht aus der `.env` — ohne diese
      # Zeile liefert es die Datei mit leerer `appID` aus, iOS verwirft sie
      # stumm, und der geteilte Link öffnet nur den Browser. Nachgemessen,
      # nicht vermutet: Genau so ist es beim ersten Versuch passiert.
      AASA_APP_ID: ${AASA_APP_ID:-}
      # Der zweite Site-Block im Caddyfile braucht **immer** eine Adresse:
      # Eine leere ist keine gültige, und Caddy startete dann auch für den
      # Prüfstand nicht. `localhost:8443` ist von außen unerreichbar und
      # damit die harmlose Vorgabe; `docker-compose.verein.yml` verlangt
      # den echten Namen dann ausdrücklich.
      VEREIN_DOMAIN: ${VEREIN_DOMAIN:-localhost:8443}
      VEREIN_AASA_APP_ID: ${VEREIN_AASA_APP_ID:-}
    ports:
      - '127.0.0.1:80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-daten:/data
    depends_on:
      - api

  mailpit:
    # Fängt alle Mails ab und zeigt sie im Browser. **Nur lokal** — auf dem
    # Server steht hier nichts, dort verschickt ein echter Anbieter.
    image: axllent/mailpit
    ports:
      - '127.0.0.1:8025:8025'

volumes:
  betrieb-postgres:
  betrieb-fotos:
  caddy-daten:
