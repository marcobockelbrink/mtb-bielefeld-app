# Nur für die Entwicklung: das Postgres, gegen das `npm test` läuft.
# Der Betriebsaufbau steht getrennt davon in `betrieb/docker-compose.yml`
# und hat ein eigenes Volume — beide laufen nebeneinander.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mtbie
      POSTGRES_PASSWORD: entwicklung
      POSTGRES_DB: mtbie
    ports:
      # Nur auf localhost. Niemals nach außen öffnen.
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres-daten:/var/lib/postgresql/data
      # Läuft nur beim allerersten Start eines frischen Volumes — siehe
      # db-init/001-wegwerf-markierung.sql.
      - ./db-init:/docker-entrypoint-initdb.d:ro

volumes:
  postgres-daten:
