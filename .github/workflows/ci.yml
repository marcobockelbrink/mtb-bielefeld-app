name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Tests und Typprüfung
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      # Die .npmrc des Projekts setzt legacy-peer-deps — nötig wegen einer
      # React-Versionsunstimmigkeit in Expo SDK 57.
      - name: Abhängigkeiten installieren
        run: npm ci

      # Expo gibt für die nativen Pakete exakte Versionen vor. Wird eines davon
      # angehoben — etwa durch einen Dependabot-Vorschlag —, bündelt die App
      # weiterhin fehlerfrei und die Tests laufen durch; kaputt geht es erst auf
      # einem echten Telefon. Diese Prüfung fängt genau das, was die übrigen
      # Schritte nicht sehen können.
      - name: Passen die Pakete zum Expo-SDK?
        run: npx expo install --check

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

      # Fängt Importfehler, die weder Tests noch Typprüfung sehen.
      - name: Bündeln prüfen
        run: npx expo export --platform android --output-dir /tmp/export-check

  api-pruefen:
    name: API — Tests und Typprüfung
    runs-on: ubuntu-latest

    # Eigener Auftrag statt Teil von „pruefen": Die API hat ein eigenes
    # package.json, eigene Abhängigkeiten und braucht eine Datenbank — beides
    # hat mit der App nichts zu tun. Die Wurzel-tsconfig.json schließt api/
    # bewusst aus (siehe dort) und die Wurzel-vitest.config.mts sammelt nur
    # tests/ — ohne diesen eigenen Auftrag liefen die API-Tests nirgends
    # automatisch.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mtbie
          POSTGRES_PASSWORD: entwicklung
          POSTGRES_DB: mtbie
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://mtbie:entwicklung@localhost:5432/mtbie

    defaults:
      run:
        working-directory: api

    steps:
      - uses: actions/checkout@v7

      # Die Skripte in api/package.json (start, migrieren, einladung:erzeugen)
      # laufen mit --experimental-strip-types — das gibt es erst ab Node
      # 22.6. Mit Node 20 wären sie in diesem Auftrag nicht lauffähig, ohne
      # dass es auffiele: Hier laufen nur vitest und tsc, keines der drei
      # Skripte. Entwickelt wird lokal auf Node 26.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Abhängigkeiten installieren
        run: npm ci

      # Auch die der Wurzel, obwohl hier nur die API geprüft wird.
      #
      # Die API bindet die geteilten Module aus der Projektwurzel ein
      # (`src/config.ts`, `src/data/ical/`, `src/domain/`). Für eine Datei
      # dort sucht vitest die nächstgelegene `tsconfig.json` — und das ist die
      # der App, die `expo/tsconfig.base` erweitert. Ohne die Wurzel-Pakete
      # scheitert deshalb schon das Übersetzen:
      #
      #     [TSCONFIG_ERROR] Failed to load tsconfig 'expo/tsconfig.base'
      #
      # Lokal fiel das nie auf, weil auf dem Entwicklungsrechner beide
      # Installationen nebeneinanderliegen. Genau darin lag der Fehler: Dieser
      # Auftrag war schlanker als die Wirklichkeit, und deshalb war die CI vom
      # 3. bis 4. August rot, während `cd api && npm test` durchlief. Ein
      # Prüflauf, der weniger installiert als die Entwicklung, prüft etwas
      # anderes als das, was gebaut wird.
      - name: Abhängigkeiten der Wurzel (für die geteilten Module)
        working-directory: .
        run: npm ci

      # Ein Dienst-Container startet Postgres, führt aber
      # docker-entrypoint-initdb.d nicht aus wie docker-compose es lokal tut
      # — das Kennzeichen aus db-init/001-wegwerf-markierung.sql fehlt also.
      # Ohne es bricht jeder Test in hilfen/datenbank.ts mit
      # Sicherheitsabbruch ab. Es hier von Hand anzulegen ist genau das, was
      # das erste Docker-Volume lokal automatisch tut.
      - name: Wegwerf-Kennzeichen anlegen
        run: psql "$DATABASE_URL" -f db-init/001-wegwerf-markierung.sql

      - name: Typprüfung
        run: npm run typecheck

      - name: Tests
        run: npm test

