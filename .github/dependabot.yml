# Dependabot hält die Abhängigkeiten aktuell und meldet bekannte Schwachstellen.
#
# Sicherheitsmeldungen kommen unabhängig von dieser Datei, sobald "Dependabot
# alerts" in den Repo-Einstellungen aktiv ist. Hier geht es um die regelmäßigen
# Aktualisierungen — damit das Projekt nicht still veraltet, bis eine Lücke
# auftaucht.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # Ein Verein hat keine Zeit für zwanzig offene Pull Requests. Lieber wenige,
    # die auch jemand anschaut.
    open-pull-requests-limit: 5
    labels:
      - abhängigkeiten
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'

    groups:
      # Expo-Pakete gehören zusammen: Einzeln aktualisiert brechen sie
      # gegeneinander. Ein Pull Request je SDK-Stand ist richtig, zwanzig
      # einzelne sind es nicht.
      expo:
        patterns:
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - 'react-native'
          - 'react-native-*'
          - 'react'
          - 'react-dom'
      entwicklung:
        dependency-type: development

    ignore:
      # Für alle Pakete, die Expo mitbringt, gibt das SDK die Version vor —
      # teils auf die Stelle genau. Ein Haupt-Versionssprung ist dort kein
      # Fortschritt, sondern ein Bruch: Die App bündelt weiterhin, die Tests
      # laufen durch, und kaputt geht es erst auf einem echten Telefon.
      #
      # Der richtige Weg zu neueren Versionen ist `npx expo install`, nicht ein
      # einzelner Pull Request. `npx expo install --check` in der CI wacht
      # zusätzlich darüber.
      #
      # Anlass war Dependabots Vorschlag, async-storage von 2.2.0 auf 3.1.1 zu
      # heben — SDK 57 legt dort exakt 2.2.0 fest.
      - dependency-name: 'expo'
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-native-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@react-native-async-storage/*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - abhängigkeiten
