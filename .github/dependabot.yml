# Dependabot hält die Abhängigkeiten aktuell und meldet bekannte Schwachstellen.
#
# Sicherheitsmeldungen kommen unabhängig von dieser Datei, sobald "Dependabot
# alerts" in den Repo-Einstellungen aktiv ist. Hier geht es um die regelmäßigen
# Aktualisierungen — damit das Projekt nicht still veraltet, bis eine Lücke
# auftaucht.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    # Ein Verein hat keine Zeit für zwanzig offene Pull Requests. Lieber wenige,
    # die auch jemand anschaut.
    open-pull-requests-limit: 5
    labels:
      - abhängigkeiten
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'

    groups:
      # Was übrig bleibt, sind Werkzeuge ohne Vorgabe durch Expo — die dürfen
      # gebündelt kommen.
      entwicklung:
        dependency-type: development

    ignore:
      # Für alle Pakete, die Expo mitbringt, gibt das SDK die Version vor —
      # teils auf die Stelle genau (React etwa auf exakt 19.2.3). Jede
      # Abweichung ist dort kein Fortschritt, sondern ein Bruch: Die App bündelt
      # weiterhin, die Tests laufen durch, und kaputt geht es erst auf einem
      # echten Telefon.
      #
      # Deshalb **alle** Aktualisierungen ignorieren, nicht nur
      # Hauptversionssprünge. Der richtige Weg zu neueren Versionen ist
      # `npx expo install` beim Wechsel auf ein neues SDK, nicht ein einzelner
      # Pull Request. `npx expo install --check` in der CI wacht darüber.
      #
      # Anlass waren drei Vorschläge, die alle an dieser Regel scheiterten:
      # async-storage 2.2.0 -> 3.1.1, React 19.2.3 -> 19.2.8 und TypeScript
      # 6.0.3 -> 7.0.2. Auch TypeScript gibt Expo vor.
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: '@expo/*'
      - dependency-name: 'react'
      - dependency-name: 'react-dom'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: 'typescript'
      - dependency-name: '@types/react'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - abhängigkeiten
